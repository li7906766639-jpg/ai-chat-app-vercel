<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KathaGPT - AI Chat</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
  }
  .app {
    width: 100%;
    max-width: 500px;
    height: 90vh;
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px;
    text-align: center;
  }
  header h1 {
    font-size: 28px;
    margin-bottom: 5px;
  }
  header p {
    font-size: 14px;
    opacity: 0.9;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .user, .ai {
    padding: 12px 15px;
    border-radius: 10px;
    max-width: 85%;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease-in;
    line-height: 1.4;
    font-size: 14px;
  }
  .user {
    align-self: flex-end;
    background: #667eea;
    color: white;
    border-radius: 15px 15px 0 15px;
  }
  .ai {
    align-self: flex-start;
    background: #f0f0f0;
    color: #333;
    border-radius: 15px 15px 15px 0;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .input-area {
    display: flex;
    padding: 15px;
    gap: 10px;
    border-top: 1px solid #e0e0e0;
    background: #f9f9f9;
  }
  textarea {
    flex: 1;
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    resize: none;
  }
  textarea:focus {
    border-color: #667eea;
  }
  button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
  }
  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.6);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>🤖 KathaGPT</h1>
    <p>Your AI Story Writer</p>
  </header>
  
  <div id="chat"></div>
  
  <div class="input-area">
    <textarea id="prompt" placeholder="Write your message..." rows="2"></textarea>
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const prompt = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

function showLoading() {
  const loader = document.createElement('div');
  loader.id = 'loading';
  loader.className = 'ai';
  loader.textContent = 'Thinking...';
  chat.appendChild(loader);
  chat.scrollTop = chat.scrollHeight;
}

function removeLoading() {
  const loader = document.getElementById('loading');
  if (loader) loader.remove();
}

sendBtn.addEventListener("click", async () => {
  const text = prompt.value.trim();
  if (!text || sendBtn.disabled) return;

  sendBtn.disabled = true;
  chat.innerHTML += `<div class="user">${text}</div>`;
  prompt.value = "";
  showLoading();

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [{ role: "user", content: text }]
      })
    });

    const data = await response.json();
    removeLoading();
    
    if (response.ok && data.choices?.[0]?.message?.content) {
      chat.innerHTML += `<div class="ai">${data.choices[0].message.content}</div>`;
    } else {
      const errorMsg = data.error?.message || 'Error occurred';
      chat.innerHTML += `<div class="ai" style="color: red;">Error: ${errorMsg}</div>`;
    }
    
    chat.scrollTop = chat.scrollHeight;

  } catch (err) {
    removeLoading();
    chat.innerHTML += `<div class="ai" style="color: red;">Error: ${err.message}</div>`;
  } finally {
    sendBtn.disabled = false;
    prompt.focus();
  }
});

prompt.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !sendBtn.disabled) {
    e.preventDefault();
    sendBtn.click();
  }
});

chat.innerHTML += `<div class="ai">Hi! I'm KathaGPT 🤖 How can I help you today?</div>`;
prompt.focus();
</script>

</body>
</html>
